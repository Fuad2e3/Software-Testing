name: Daily Auto Commit

on:
  schedule:
    # প্রতিদিন সকাল 8:30 (বাংলাদেশ সময়)
    # 8:30 AM BST is 2:30 AM UTC (UTC+6)
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Daily Log
        run: |
          echo "Last Update: $(date -u)" > daily-log.txt

      - name: Commit Changes
        run: |
          git config user.name "MD. ABDULLAH AL FUAD"
          git config user.email "fuadkalaroa2002@gmail.com"

          git add -A
          git diff --cached --quiet || git commit -m "Update daily log and sync project changes"

      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
